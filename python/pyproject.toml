[project]
name = "determinist"
version = "0.2.2"
description = "A deterministic password generator"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "platformdirs>=4.11.0",
    "tomli-w>=1.2.0",
    "typer>=0.27.0",
]

[project.scripts]
determinist = "determinist.generator:app"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
buuild-backend = "uv_build"

[tool.uv.extra-build-dependencies]
determinist = ["setuptools"]
